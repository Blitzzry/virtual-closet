<div class="flex w-full h-full gap-5 mt-5 items-center">
    <div class="flex flex-col justify-center items-center gap-4 w-full">
        @if (authService.userIsLoggedIn()){
        <div class="flex w-full justify-end mb-3 gap-2 px-3">
            <button class="log-in-btn" (click)="logIn()">Log In!</button>
            <button class="sign-up-btn" (click)="signUp()">Sign Up!</button>
        </div>
        }
        @if (garment.length > 0) {
        <div class="grid grid-cols-3 gap-3 md:grid-cols-4 lg:grid-cols-5">
            @for (item of garment; track $index) {
            <app-clothing-card class="w-full" [category]="item.category" [colors]="item.colors"
                [imageUrl]="item.imageUrl" [name]="item.name"></app-clothing-card>
            }
        </div>
        } @else {
        <div class="max-w-82">
            <span class="text-center"> You do not have any garment yet, add one right now with the
                button on the left and bottom of your
                screen! </span>
        </div>
        }
        <button class="position absolute bottom-6 right-6" (click)="openModal()"><app-icon name="upload" /></button>
        @if (isGarmentModalOpen) {
        <app-upload-garment class="modal" (close)="closeModal()"></app-upload-garment>
        }
    </div>
</div>
