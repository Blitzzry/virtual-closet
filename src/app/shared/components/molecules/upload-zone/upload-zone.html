<div class="w-full flex flex-col items-center justify-center card">
    <app-icon [name]="'hanger'" [size]="'lg'"></app-icon>
    <div (click)="fileInput.click()" class="dropzone">
        <p class="max-w-50 text-center">
            {{'UPLOAD_ZONE.DROP_HINT_BEFORE' | translate}}
            <span class="gold">{{'UPLOAD_ZONE.DROP_HINT_BROWSE' | translate}}</span>
        </p>
        <input #fileInput type="file" hidden (change)="ClothingService.onFileSelected($event)" class="w-full h-full"/>
    </div>
</div>
