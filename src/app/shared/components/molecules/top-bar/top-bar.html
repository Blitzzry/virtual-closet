<div class="w-full card px-8 md:px-8 flex items-center justify-between">
    <h1 class="text-2xl logo"> {{ 'COMMON.APP_NAME' | translate}} </h1>
    @if (clothingService.windowWidth() <= 768){ 
    <div class="flex gap-2 items-center">
        <button class="primary-btn p-3!" (click)="outfitMaker()"><app-icon [name]="'stars'"></app-icon></button>
        <span class="principal">{{ userName }}</span>
        <button class="primary-btn p-3!" (click)="authService.signOut()"><app-icon [name]="'exit'"></app-icon></button>
    </div>
} @else {
<div class="flex items-center gap-8">
    <button class="primary-btn" (click)="outfitMaker()"><app-icon [name]="'stars'"></app-icon>{{ 'NAV.MAKE_OUTFIT' | translate }}</button>
    <span class="principal">{{ userName }}</span>
    <button class="primary-btn" (click)="clothingService.signOut()">{{ 'NAV.SIGN_OUT' | translate }}</button>
    <div>
        <button (click)="changeLanguage('es')">ES</button>
        <button (click)="changeLanguage('en')">EN</button>
    </div>
</div>
}
</div>
