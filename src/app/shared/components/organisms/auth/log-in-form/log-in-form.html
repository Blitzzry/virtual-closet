<div class="w-full h-full items-center justify-center flex mt-5">
    <div class="w-92 flex flex-col items-center justify-center p-6 rounded-lg bg-white shadow-md border-black border-1">
        <button [routerLink]="['/']" class="self-end text-lg cursor-pointer">
            x
        </button>
        <h1 class="text-2xl font-semibold text-gray-800">Mooder</h1>
        <span class="mb-3">Create an account!</span>
        <div class="flex flex-col gap-1.5">
            <span class="text-sm">Email</span>
            <input type="email" placeholder="your@email.com" [(ngModel)]="email" />
            <span class="text-sm">Password</span>
            <input type="password" placeholder="....." [(ngModel)]="password" />
            <div class="grid grid-cols-2 w-auto gap-14">
                <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#5C554C;">
                    <input [(ngModel)]="rememberMe" type="checkbox"
                        style="width:14px;height:14px;accent-color:#C4A86A;" />
                    Recuérdame
                </label>
                <button class="text-sm text-gray-600 hover:underline mt-1 justify-self-end">Forgot password?</button>
            </div>
            <button class="sign-up-btn my-2" (click)="signIn()">Log in!</button>
        </div>
        <div class="flex flex-col gap-2 items-center w-full">
            <span class="text-sm mt-1">You don't have an account? <a [routerLink]="['/signUp']" class="signIn hover:underline">Sign up</a></span>
        </div>
    </div>
</div>
